# 병원 공통 설정 — 처음 한 번만 채우면 매주 재사용됩니다.

병원명: "OO의원"
연락처: "02-000-0000"
주소: "서울시 OO구 OO로 00"

# 엔딩 화면에 항상 들어가는 문구 (의료광고 고지문 등). '|' 위치에서 줄이 바뀝니다.
고지문: "개인에 따라 효과와 부작용이 다를 수 있으며,|시술 전 의료진과 충분히 상담하세요."

# 색상 (16진수)
메인색: "#1F3A5F"     # 오프닝·엔딩 배경
글자색: "#FFFFFF"
강조색: "#F2C14E"     # 오프닝 제목 아래 선

# 글꼴 — 비워두면 Noto Sans CJK(무료) 사용
# 병원 전용 글꼴을 쓰려면 03_design/_common/ 에 .ttf/.otf 파일을 넣고 파일명을 적으세요.
글꼴파일: ""

# 나레이션 음성 (Edge TTS, 무료)
#   ko-KR-SunHiNeural (여성) / ko-KR-InJoonNeural (남성)
음성: "ko-KR-SunHiNeural"
말하기속도: "+5%"      # -20% ~ +20% 권장

# 03_design/_common/ 에 넣은 파일명 (없으면 비워두기)
로고파일: ""          # 예: logo.png (투명 배경 PNG 권장)
배경음악파일: ""      # 예: bgm.mp3 (저작권 확인된 음원만)
배경음악볼륨: 0.12    # 0~1

# 장면 길이(초)
