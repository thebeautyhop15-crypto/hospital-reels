name: 3. 인스타그램 발행

# 승인 + 제작 + 품질 점검을 통과한 이번 주 릴스를 인스타그램에 발행
# - 지금은 수동 실행만 켜 둠. 발행 요일·시각이 정해지면 schedule 을 추가
# - 같은 주차는 한 번만 발행 (04_output/<주차>/published_instagram.json 으로 기록)
on:
  workflow_dispatch:
    inputs:
      week:
        description: "주차 (예: 2026-W49). 비우면 이번 주"
        required: false
      check_only:
        description: "발행하지 않고 점검만 (토큰·영상 주소·캡션 확인)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: 인스타그램 발행
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION }}
          PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          cd scripts
          python publish_instagram.py ${{ github.event.inputs.week }} ${{ github.event.inputs.check_only == 'true' && '--check' || '' }}

      - name: 발행 기록 저장(커밋)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 04_output
          if ! git diff --cached --quiet; then
            git commit -m "인스타그램 발행 기록"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
